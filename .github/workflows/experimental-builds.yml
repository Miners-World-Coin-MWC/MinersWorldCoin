name: Experimental Builds

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/experimental-builds.yml'
      - '**/configure.ac'
      - 'depends/**'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.am'

  pull_request:
    paths:
      - '.github/workflows/experimental-builds.yml'
      - '**/configure.ac'
      - 'depends/**'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.am'


permissions:
  contents: read


# ============================================================================
# GLOBAL EXPERIMENTAL BUILD SETTINGS
# ============================================================================

env:
  MAKEJOBS: "-j3"
  CHECK_DOC: "0"
  CCACHE_SIZE: "150M"
  CCACHE_TEMPDIR: /tmp/.ccache-temp
  CCACHE_COMPRESS: "1"

  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_API_LEVEL: "24"


jobs:

  # ==========================================================================
  # EXPERIMENTAL LINUX CROSS BUILDS
  #
  # Targets:
  #
  #   ppc64le-linux
  #   s390x-linux
  #   loongarch64-linux
  #
  # These are intentionally separate from the normal CI matrix.
  # ==========================================================================

  linux-cross:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        name:
          - ppc64le-linux
          - s390x-linux
          - loongarch64-linux

        include:

          # ================================================================
          # POWERPC64LE
          # ================================================================

          - name: ppc64le-linux
            host: powerpc64le-linux-gnu
            packages: >
              gcc-powerpc64le-linux-gnu
              g++-powerpc64le-linux-gnu
              qemu-user-static
              qemu-user
            cc: powerpc64le-linux-gnu-gcc
            cxx: powerpc64le-linux-gnu-g++
            openssl-target: linux-ppc64le
            experimental: true
            dep-opts: "NO_QT=1 NO_ZMQ=1 NO_UPNP=1 NO_NATPMP=1"
            config-opts: "--disable-tests --disable-bench --without-gui --disable-zmq"
            goal: install

          # ================================================================
          # IBM S390X
          # ================================================================

          - name: s390x-linux
            host: s390x-linux-gnu
            packages: >
              gcc-s390x-linux-gnu
              g++-s390x-linux-gnu
              qemu-user-static
              qemu-user
            cc: s390x-linux-gnu-gcc
            cxx: s390x-linux-gnu-g++
            openssl-target: linux64-s390x
            experimental: true
            dep-opts: "NO_QT=1 NO_ZMQ=1 NO_UPNP=1 NO_NATPMP=1"
            config-opts: "--disable-tests --disable-bench --without-gui --disable-zmq"
            goal: install

          # ================================================================
          # LOONGARCH64
          #
          # Ubuntu 24.04 provides the LoongArch cross compiler as the
          # versioned gcc-14/g++-14 packages in Universe.
          # ================================================================

          - name: loongarch64-linux
            host: loongarch64-linux-gnu
            packages: >
              gcc-14-loongarch64-linux-gnu
              g++-14-loongarch64-linux-gnu
              qemu-user-static
              qemu-user
            cc: loongarch64-linux-gnu-gcc-14
            cxx: loongarch64-linux-gnu-g++-14
            openssl-target: linux64-loongarch64
            experimental: true
            dep-opts: "NO_QT=1 NO_ZMQ=1 NO_UPNP=1 NO_NATPMP=1"
            config-opts: "--disable-tests --disable-bench --without-gui --disable-zmq"
            goal: install

    continue-on-error: ${{ matrix.experimental == true }}

    timeout-minutes: 360

    runs-on: ubuntu-24.04

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # ======================================================================
      # Install packages
      # ======================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          # LoongArch cross packages live in Ubuntu Universe.
          sudo add-apt-repository -y universe || true

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            curl \
            ca-certificates \
            git \
            python3 \
            python3-pip \
            ccache \
            file \
            ${{ matrix.packages }}


      # ======================================================================
      # Toolchain information
      # ======================================================================

      - name: Show target toolchain
        shell: bash
        run: |
          set -euxo pipefail

          uname -a

          echo ""
          echo "Compiler:"
          ${{ matrix.cc }} --version

          echo ""
          echo "C++ compiler:"
          ${{ matrix.cxx }} --version

          echo ""
          echo "Target:"
          ${{ matrix.cc }} -dumpmachine || true

          echo ""
          echo "OpenSSL target:"
          echo "${{ matrix.openssl-target }}"


      # ======================================================================
      # Prepare build system
      # ======================================================================

      - name: Prepare build system
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x autogen.sh configure 2>/dev/null || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git submodule update --init --recursive

          chmod +x autogen.sh configure 2>/dev/null || true

          ./autogen.sh


      # ======================================================================
      # Build depends
      # ======================================================================

      - name: Build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export OPENSSL_TARGET="${{ matrix.openssl-target }}"

          echo "OPENSSL_TARGET=${OPENSSL_TARGET}"

          make $MAKEJOBS -C depends \
            HOST="${{ matrix.host }}" \
            OPENSSL_TARGET="${OPENSSL_TARGET}" \
            ${{ matrix.dep-opts }}


      # ======================================================================
      # Configure
      # ======================================================================

      - name: Configure MinersWorldCoin
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euxo pipefail

          PREFIX="${PWD}/depends/${{ matrix.host }}"

          ./configure \
            --host="${{ matrix.host }}" \
            --prefix="${PREFIX}" \
            ${{ matrix.config-opts }} \
            --enable-reduce-exports \
            CFLAGS="-O2 -pipe" \
            CXXFLAGS="-std=c++17 -O2 -pipe" \
            LDFLAGS="-static-libstdc++" \
            2>&1 | tee configure.console \
            || (
              echo ""
              echo "============================================================"
              echo "configure FAILED"
              echo "============================================================"

              tail -n 80 configure.console

              echo ""
              echo "configure errors from config.log:"
              grep -nE \
                'configure:[0-9]+: error:|^configure: error:' \
                config.log || true

              false
            )


      # ======================================================================
      # Build
      # ======================================================================

      - name: Build MinersWorldCoin
        shell: bash
        run: |
          set -euxo pipefail

          make $MAKEJOBS ${{ matrix.goal }} \
            || (
              echo ""
              echo "============================================================"
              echo "Build failure - verbose build follows"
              echo "============================================================"

              make ${{ matrix.goal }} V=1

              false
            )


      # ======================================================================
      # Inspect
      # ======================================================================

      - name: Inspect binaries
        shell: bash
        run: |
          set -euxo pipefail

          BIN="depends/${{ matrix.host }}/bin"

          find "$BIN" \
            -maxdepth 1 \
            -type f \
            -print \
            -exec file {} \; \
            || true

          test -f "$BIN/minersworldcoind"
          test -f "$BIN/minersworldcoin-cli"
          test -f "$BIN/minersworldcoin-tx"


      # ======================================================================
      # Upload
      # ======================================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            depends/${{ matrix.host }}/bin/minersworldcoin*
            depends/${{ matrix.host }}/lib/libbitcoinconsensus*
            depends/${{ matrix.host }}/include/bitcoinconsensus.h


  # ==========================================================================
  # EXPERIMENTAL ARM64 MUSL
  #
  # Real Alpine ARM64 environment under QEMU.
  # ==========================================================================

  aarch64-linux-musl:
    name: aarch64-linux-musl

    continue-on-error: true

    timeout-minutes: 360

    runs-on: ubuntu-latest

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # ======================================================================
      # Alpine ARM64 VM
      # ======================================================================

      - name: Build ARM64 musl
        uses: vmactions/alpine-vm@v1
        with:
          release: "3.23"
          arch: aarch64
          usesh: true
          mem: 8192
          cpu: 4
          sync: rsync
          copyback: true

          prepare: |
            set -eux

            apk add --no-cache \
              bash \
              git \
              build-base \
              linux-headers \
              autoconf \
              automake \
              libtool \
              pkgconf \
              python3 \
              py3-pip \
              curl \
              ca-certificates \
              file \
              cmake \
              perl \
              patch \
              make

            chmod +x ./autogen.sh 2>/dev/null || true
            chmod +x ./configure 2>/dev/null || true

          run: |
            set -eux

            echo "============================================================"
            echo "ARM64 musl environment"
            echo "============================================================"

            uname -a

            echo ""
            echo "Architecture:"
            uname -m

            echo ""
            echo "Alpine:"
            cat /etc/alpine-release

            echo ""
            echo "Compiler:"
            gcc --version

            echo ""
            echo "C++ compiler:"
            g++ --version

            echo ""
            echo "Compiler target:"
            gcc -dumpmachine


            echo ""
            echo "============================================================"
            echo "Repository preparation"
            echo "============================================================"

            git config --global --add safe.directory "$(pwd)"

            git submodule sync --recursive
            git submodule update --init --recursive

            chmod +x ./autogen.sh 2>/dev/null || true
            chmod +x ./configure 2>/dev/null || true

            test -f ./autogen.sh
            test -f ./configure

            test -x ./autogen.sh
            test -x ./configure

            echo ""
            echo "autogen.sh:"
            ls -la ./autogen.sh

            echo ""
            echo "configure:"
            ls -la ./configure


            echo ""
            echo "============================================================"
            echo "Generate build system"
            echo "============================================================"

            ./autogen.sh


            echo ""
            echo "============================================================"
            echo "Fix generated build-system permissions"
            echo "============================================================"

            # vmactions/rsync can drop executable bits. autotools also
            # generates additional helper scripts after autogen.sh.
            #
            # depends/config.guess and depends/config.sub are required
            # directly by the depends build system, so make sure they are
            # executable before invoking make.

            chmod +x ./depends/config.guess 2>/dev/null || true
            chmod +x ./depends/config.sub 2>/dev/null || true

            find ./depends \
              -type f \
              \( \
                -name 'config.guess' \
                -o -name 'config.sub' \
                -o -name 'configure' \
                -o -name '*.sh' \
              \) \
              -exec chmod +x {} \; \
              2>/dev/null || true

            echo ""
            echo "depends/config.guess:"
            ls -la ./depends/config.guess

            echo ""
            echo "depends/config.sub:"
            ls -la ./depends/config.sub


            echo ""
            echo "============================================================"
            echo "Verify depends build files"
            echo "============================================================"

            test -x ./depends/config.guess
            test -x ./depends/config.sub

            echo ""
            echo "depends directory:"
            ls -la ./depends | head -n 80


            echo ""
            echo "============================================================"
            echo "ARM64 musl dependency build"
            echo "============================================================"

            make -j3 -C depends \
              HOST=aarch64-linux-musl \
              NO_QT=1 \
              NO_ZMQ=1 \
              NO_UPNP=1 \
              NO_NATPMP=1 \
              NO_OPENSSL_LEGACY=1


            echo ""
            echo "============================================================"
            echo "ARM64 musl configure"
            echo "============================================================"

            PREFIX="${PWD}/depends/aarch64-linux-musl"

            ./configure \
              --host=aarch64-linux-musl \
              --prefix="${PREFIX}" \
              --disable-tests \
              --disable-bench \
              --without-gui \
              --disable-zmq \
              --enable-reduce-exports \
              CFLAGS="-O2 -pipe" \
              CXXFLAGS="-std=c++17 -O2 -pipe" \
              LDFLAGS="-static-libstdc++" \
              2>&1 | tee configure.console \
              || (
                echo ""
                echo "============================================================"
                echo "configure FAILED"
                echo "============================================================"

                tail -n 100 configure.console

                echo ""
                echo "Relevant config.log errors:"
                grep -nE \
                  'configure:[0-9]+: error:|^configure: error:' \
                  config.log || true

                false
              )


            echo ""
            echo "============================================================"
            echo "ARM64 musl build"
            echo "============================================================"

            make -j3 install \
              || (
                echo ""
                echo "============================================================"
                echo "Normal build failed - verbose build follows"
                echo "============================================================"

                make V=1 install

                false
              )


            echo ""
            echo "============================================================"
            echo "ARM64 musl binaries"
            echo "============================================================"

            BIN="depends/aarch64-linux-musl/bin"

            find "$BIN" \
              -maxdepth 1 \
              -type f \
              -name 'minersworldcoin*' \
              -print \
              -exec file {} \;


            echo ""
            echo "============================================================"
            echo "Binary architecture verification"
            echo "============================================================"

            file \
              "$BIN/minersworldcoind" \
              "$BIN/minersworldcoin-cli" \
              "$BIN/minersworldcoin-tx"


            echo ""
            echo "============================================================"
            echo "Required binaries"
            echo "============================================================"

            test -f "$BIN/minersworldcoind"
            test -f "$BIN/minersworldcoin-cli"
            test -f "$BIN/minersworldcoin-tx"


            echo ""
            echo "============================================================"
            echo "ARM64 musl build completed"
            echo "============================================================"


      # ======================================================================
      # Upload
      # ======================================================================

      - name: Upload ARM64 musl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-aarch64-linux-musl
          if-no-files-found: ignore
          path: |
            depends/aarch64-linux-musl/bin/minersworldcoin*
            depends/aarch64-linux-musl/lib/libbitcoinconsensus*
            depends/aarch64-linux-musl/include/bitcoinconsensus.h


  # ==========================================================================
  # EXPERIMENTAL RISC-V 32
  # ==========================================================================

  riscv32-linux:
    name: riscv32-linux

    continue-on-error: true

    timeout-minutes: 360

    runs-on: ubuntu-24.04

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # ======================================================================
      # Install toolchain
      # ======================================================================

      - name: Install RISC-V build tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            clang \
            llvm \
            lld \
            qemu-user-static \
            qemu-user \
            file \
            python3 \
            curl \
            ca-certificates \
            git


      # ======================================================================
      # Prepare
      # ======================================================================

      - name: Prepare build system
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x autogen.sh configure 2>/dev/null || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git submodule update --init --recursive

          chmod +x autogen.sh configure 2>/dev/null || true

          ./autogen.sh


      # ======================================================================
      # Probe
      # ======================================================================

      - name: Probe RISC-V 32 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          clang --version

          clang \
            --target=riscv32-linux-gnu \
            -march=rv32gc \
            -mabi=ilp32d \
            -x c \
            -c \
            -o /tmp/riscv32-probe.o \
            - <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          file /tmp/riscv32-probe.o


      # ======================================================================
      # Dependencies
      # ======================================================================

      - name: Attempt dependency build
        shell: bash
        run: |
          set -euxo pipefail

          make $MAKEJOBS -C depends \
            HOST=riscv32-linux-gnu \
            NO_QT=1 \
            NO_ZMQ=1 \
            NO_UPNP=1 \
            NO_NATPMP=1


      # ======================================================================
      # Configure
      # ======================================================================

      - name: Configure RISC-V 32
        shell: bash
        run: |
          set -euxo pipefail

          export CC="clang --target=riscv32-linux-gnu -march=rv32gc -mabi=ilp32d"
          export CXX="clang++ --target=riscv32-linux-gnu -march=rv32gc -mabi=ilp32d"

          ./configure \
            --host=riscv32-linux-gnu \
            --prefix="${PWD}/depends/riscv32-linux-gnu" \
            --disable-tests \
            --disable-bench \
            --without-gui \
            --disable-zmq \
            --enable-reduce-exports \
            2>&1 | tee configure.console \
            || (
              tail -n 80 configure.console
              grep -nE \
                'configure:[0-9]+: error:|^configure: error:' \
                config.log || true
              false
            )


      # ======================================================================
      # Build
      # ======================================================================

      - name: Build RISC-V 32
        shell: bash
        run: |
          set -euxo pipefail

          make $MAKEJOBS install \
            || (
              make V=1 install
              false
            )


      # ======================================================================
      # Upload
      # ======================================================================

      - name: Upload RISC-V 32 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-riscv32-linux
          if-no-files-found: ignore
          path: |
            depends/riscv32-linux-gnu/bin/minersworldcoin*
            depends/riscv32-linux-gnu/lib/libbitcoinconsensus*
            depends/riscv32-linux-gnu/include/bitcoinconsensus.h


  # ==========================================================================
  # EXPERIMENTAL ANDROID / TERMUX
  #
  # Native Android executables, NOT APKs.
  #
  # Targets:
  #
  #   ARMv7
  #   x86
  #   x86_64
  # ==========================================================================

  android:
    name: android-${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        name:
          - armv7-termux
          - x86-termux
          - x86_64-termux

        include:

          # ================================================================
          # ARMv7
          # ================================================================

          - name: armv7-termux
            host: arm-linux-androideabi
            target: armv7a-linux-androideabi
            arch: armv7-a
            abi: armeabi-v7a
            experimental: true

          # ================================================================
          # x86
          # ================================================================

          - name: x86-termux
            host: i686-linux-android
            target: i686-linux-android
            arch: i686
            abi: x86
            experimental: true

          # ================================================================
          # x86_64
          # ================================================================

          - name: x86_64-termux
            host: x86_64-linux-android
            target: x86_64-linux-android
            arch: x86-64
            abi: x86_64
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    timeout-minutes: 360

    runs-on: ubuntu-24.04

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # ======================================================================
      # Java
      # ======================================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================================
      # Android SDK
      # ======================================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-24"


      # ======================================================================
      # Android NDK
      # ======================================================================

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "ANDROID_TOOLCHAIN_BIN=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_ENV"


      # ======================================================================
      # Host tools
      # ======================================================================

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            autotools-dev \
            bsdmainutils \
            python3 \
            python3-pip \
            curl \
            ca-certificates \
            file


      # ======================================================================
      # Prepare
      # ======================================================================

      - name: Prepare build system
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x autogen.sh configure 2>/dev/null || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git submodule update --init --recursive

          chmod +x autogen.sh configure 2>/dev/null || true

          ./autogen.sh


      # ======================================================================
      # Configure Android compiler
      # ======================================================================

      - name: Configure Android compiler
        shell: bash
        run: |
          set -euxo pipefail

          case "${{ matrix.name }}" in

            armv7-termux)
              CC="${ANDROID_TOOLCHAIN_BIN}/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"
              CXX="${ANDROID_TOOLCHAIN_BIN}/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang++"
              ;;

            x86-termux)
              CC="${ANDROID_TOOLCHAIN_BIN}/i686-linux-android${ANDROID_API_LEVEL}-clang"
              CXX="${ANDROID_TOOLCHAIN_BIN}/i686-linux-android${ANDROID_API_LEVEL}-clang++"
              ;;

            x86_64-termux)
              CC="${ANDROID_TOOLCHAIN_BIN}/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
              CXX="${ANDROID_TOOLCHAIN_BIN}/x86_64-linux-android${ANDROID_API_LEVEL}-clang++"
              ;;

            *)
              echo "Unknown Android target"
              exit 1
              ;;
          esac

          export CC
          export CXX

          export AR="${ANDROID_TOOLCHAIN_BIN}/llvm-ar"
          export RANLIB="${ANDROID_TOOLCHAIN_BIN}/llvm-ranlib"
          export STRIP="${ANDROID_TOOLCHAIN_BIN}/llvm-strip"

          {
            echo "CC=${CC}"
            echo "CXX=${CXX}"
            echo "AR=${AR}"
            echo "RANLIB=${RANLIB}"
            echo "STRIP=${STRIP}"
          } >> "$GITHUB_ENV"

          echo ""
          echo "CC:"
          "$CC" --version

          echo ""
          echo "CXX:"
          "$CXX" --version


      # ======================================================================
      # Android dependencies
      # ======================================================================

      - name: Build Android dependencies
        shell: bash
        run: |
          set -euxo pipefail

          make $MAKEJOBS -C depends \
            HOST="${{ matrix.host }}" \
            ANDROID_SDK="${ANDROID_SDK_ROOT}" \
            ANDROID_NDK="${ANDROID_NDK}" \
            ANDROID_API_LEVEL="${ANDROID_API_LEVEL}" \
            ANDROID_TOOLCHAIN_BIN="${ANDROID_TOOLCHAIN_BIN}" \
            NO_QT=1 \
            NO_ZMQ=1 \
            NO_UPNP=1 \
            NO_NATPMP=1


      # ======================================================================
      # Configure
      # ======================================================================

      - name: Configure MinersWorldCoin
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="${PWD}/depends/${{ matrix.host }}"

          ./configure \
            --host="${{ matrix.host }}" \
            --prefix="${PREFIX}" \
            --disable-tests \
            --disable-bench \
            --without-gui \
            --disable-zmq \
            --enable-reduce-exports \
            CFLAGS="-O2 -fPIE -fPIC" \
            CXXFLAGS="-std=c++17 -O2 -fPIE -fPIC" \
            CPPFLAGS="-I${PREFIX}/include" \
            LDFLAGS="-L${PREFIX}/lib -fPIE -pie" \
            2>&1 | tee configure.console \
            || (
              tail -n 80 configure.console
              grep -nE \
                'configure:[0-9]+: error:|^configure: error:' \
                config.log || true
              false
            )


      # ======================================================================
      # Build
      # ======================================================================

      - name: Build Android binaries
        shell: bash
        run: |
          set -euxo pipefail

          make $MAKEJOBS install \
            CXXFLAGS="-std=c++17 -O2 -fPIE -fPIC" \
            || (
              make V=1 install
              false
            )

          "${STRIP}" \
            --strip-debug \
            --strip-unneeded \
            "depends/${{ matrix.host }}/bin/minersworldcoind" \
            "depends/${{ matrix.host }}/bin/minersworldcoin-cli" \
            "depends/${{ matrix.host }}/bin/minersworldcoin-tx" \
            2>/dev/null || true


      # ======================================================================
      # Inspect
      # ======================================================================

      - name: Inspect Android binaries
        shell: bash
        run: |
          set -euxo pipefail

          BIN="depends/${{ matrix.host }}/bin"

          find "$BIN" \
            -maxdepth 1 \
            -type f \
            -print \
            -exec file {} \;

          test -f "$BIN/minersworldcoind"
          test -f "$BIN/minersworldcoin-cli"
          test -f "$BIN/minersworldcoin-tx"


      # ======================================================================
      # Upload
      # ======================================================================

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-android-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            depends/${{ matrix.host }}/bin/minersworldcoin*
            depends/${{ matrix.host }}/lib/libbitcoinconsensus*
            depends/${{ matrix.host }}/include/bitcoinconsensus.h


  # ==========================================================================
  # EXPERIMENTAL FREEBSD
  #
  # vmactions boots a real FreeBSD VM under the GitHub Linux runner.
  # ==========================================================================

  freebsd:
    name: freebsd-${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        name:
          - x86_64
          - arm64

        include:

          - name: x86_64
            arch: x86_64
            release: "15.0"
            experimental: true

          - name: arm64
            arch: aarch64
            release: "15.0"
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    timeout-minutes: 360

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 8192
          cpu: 4
          sync: rsync
          copyback: true

          prepare: |
            set -eux

            pkg update -f

            pkg install -y \
              bash \
              git \
              gmake \
              autoconf \
              automake \
              libtool \
              pkgconf \
              boost-libs \
              openssl \
              libevent \
              db18

            chmod +x ./autogen.sh ./configure 2>/dev/null || true

          run: |
            set -eux

            git config --global --add safe.directory "$(pwd)"

            git submodule update --init --recursive

            chmod +x ./autogen.sh ./configure 2>/dev/null || true

            ./autogen.sh

            chmod +x ./configure 2>/dev/null || true

            ./configure \
              --prefix="${PWD}/bsd-out" \
              --disable-tests \
              --disable-bench \
              --without-gui \
              --disable-zmq \
              --enable-reduce-exports \
              2>&1 | tee configure.console \
              || (
                tail -n 80 configure.console
                grep -nE \
                  'configure:[0-9]+: error:|^configure: error:' \
                  config.log || true
                false
              )

            gmake -j3
            gmake install

            find bsd-out \
              -type f \
              -name 'minersworldcoin*' \
              -print \
              -exec file {} \;


      - name: Upload FreeBSD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-freebsd-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            bsd-out/bin/minersworldcoin*
            bsd-out/lib/libbitcoinconsensus*
            bsd-out/include/bitcoinconsensus.h


