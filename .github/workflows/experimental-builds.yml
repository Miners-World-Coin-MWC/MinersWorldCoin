  # ==========================================================================
  # EXPERIMENTAL NATIVE ARM64 LINUX
  #
  # This is a genuine ARM64 GitHub-hosted runner.
  # ==========================================================================

  linux-arm64-native:
    name: linux-arm64-native

    continue-on-error: true

    timeout-minutes: 360

    runs-on: ubuntu-24.04-arm

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # ======================================================================
      # Host dependencies
      # ======================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            python3 \
            python3-pip \
            ccache \
            curl \
            ca-certificates \
            git \
            file


      # ======================================================================
      # Build
      # ======================================================================

      - name: Build native ARM64
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x autogen.sh configure 2>/dev/null || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git submodule update --init --recursive

          chmod +x autogen.sh configure 2>/dev/null || true

          ./autogen.sh

          make $MAKEJOBS -C depends \
            HOST=aarch64-linux-gnu \
            NO_QT=1 \
            NO_ZMQ=1 \
            NO_UPNP=1 \
            NO_NATPMP=1

          ./configure \
            --host=aarch64-linux-gnu \
            --prefix="${PWD}/depends/aarch64-linux-gnu" \
            --disable-tests \
            --disable-bench \
            --without-gui \
            --disable-zmq \
            --enable-reduce-exports \
            2>&1 | tee configure.console \
            || (
              tail -n 80 configure.console
              grep -nE \
                'configure:[0-9]+: error:|^configure: error:' \
                config.log || true
              false
            )

          make $MAKEJOBS install


      # ======================================================================
      # Inspect
      # ======================================================================

      - name: Inspect ARM64 binaries
        shell: bash
        run: |
          set -euxo pipefail

          file \
            depends/aarch64-linux-gnu/bin/minersworldcoind \
            depends/aarch64-linux-gnu/bin/minersworldcoin-cli \
            depends/aarch64-linux-gnu/bin/minersworldcoin-tx

          test -f depends/aarch64-linux-gnu/bin/minersworldcoind
          test -f depends/aarch64-linux-gnu/bin/minersworldcoin-cli
          test -f depends/aarch64-linux-gnu/bin/minersworldcoin-tx


      # ======================================================================
      # Upload
      # ======================================================================

      - name: Upload ARM64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-linux-arm64-native
          if-no-files-found: ignore
          path: |
            depends/aarch64-linux-gnu/bin/minersworldcoin*
            depends/aarch64-linux-gnu/lib/libbitcoinconsensus*
            depends/aarch64-linux-gnu/include/bitcoinconsensus.h