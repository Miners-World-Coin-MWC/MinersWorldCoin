
name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'

jobs:
  build:
    name: ${{ matrix.name }}

    env:
      MAKEJOBS: "-j3"
      CHECK_DOC: "0"
      CCACHE_SIZE: "100M"
      CCACHE_TEMPDIR: /tmp/.ccache-temp
      CCACHE_COMPRESS: "1"
      PYTHON_DEBUG: "1"
      CACHE_NONCE: "3"
      WINEDEBUG: fixme-all
      WINEPREFIX: /tmp/wineprefix/
      CACHE_NAME: "ci-cache"

    strategy:
      fail-fast: false
      matrix:
        name:
          - aarch64-linux
          - armhf-linux
          - armv7-linux
          - i686-linux
          - i686-win
          - riscv64-linux
          - x86_64-linux
          - x86_64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-win

        include:
          - name: i686-linux
            host: i686-pc-linux-gnu
            container: ubuntu:20.04
            packages: g++-multilib bc python3-zmq
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: ""
            config-opts: "--enable-zmq --enable-glibc-back-compat --with-gui=qt5 LDFLAGS=-static-libstdc++ --disable-tests"
            goal: install

          - name: armhf-linux
            host: arm-linux-gnueabihf
            container: ubuntu:20.04
            packages: g++-arm-linux-gnueabihf qemu-user-static qemu-user
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: "NO_QT=1"
            config-opts: "--enable-glibc-back-compat LDFLAGS=-static-libstdc++ --disable-tests"
            goal: install

          - name: armv7-linux
            host: arm-linux-gnueabihf
            container: ubuntu:20.04
            packages: g++-arm-linux-gnueabihf qemu-user-static qemu-user
            dep-opts: ""
            config-opts: "--disable-tests --without-gui"
            goal: install

          - name: aarch64-linux
            host: aarch64-linux-gnu
            container: ubuntu:20.04
            packages: g++-aarch64-linux-gnu qemu-user-static qemu-user
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: "NO_QT=1"
            config-opts: "--enable-zmq --enable-glibc-back-compat LDFLAGS=-static-libstdc++ --disable-tests"
            goal: install

          - name: x86_64-linux
            host: x86_64-unknown-linux-gnu
            container: ubuntu:20.04
            packages: python3 g++-multilib bc python3-zmq
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: ""
            config-opts: "--enable-zmq --enable-glibc-back-compat --with-gui=qt5 LDFLAGS=-static-libstdc++ --disable-tests"
            goal: install

          - name: x86_64-linux-musl
            host: x86_64-linux-musl
            container: alpine:3.19
            packages: build-base linux-headers cmake python3 bash git curl perl automake autoconf libtool pkgconfig
            dep-opts: "NO_QT=1 NO_OPENSSL_LEGACY=1"
            config-opts: "--disable-tests --without-gui CXXFLAGS=-Wno-deprecated-declarations"
            goal: install

          - name: riscv64-linux
            host: riscv64-linux-gnu
            container: ubuntu:20.04
            packages: g++-riscv64-linux-gnu qemu-user-static qemu-user
            dep-opts: "NO_QT=1"
            config-opts: "--disable-tests"
            goal: install

          - name: i686-win
            host: i686-w64-mingw32
            container: ubuntu:20.04
            container-options: --privileged
            packages: python3 nsis g++-mingw-w64-i686 wine32 bc wine-binfmt binfmt-support
            preinstall: |
              dpkg --add-architecture i386
            postinstall: |
              update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
              update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
              update-binfmts --import /usr/share/binfmts/wine
              update-binfmts --enable
              update-binfmts --display
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: ""
            config-opts: "--with-gui=qt5 --disable-tests"
            goal: install

          - name: x86_64-win
            host: x86_64-w64-mingw32
            container: ubuntu:20.04
            container-options: --privileged
            packages: python3 nsis g++-mingw-w64-x86-64 wine64 bc wine-binfmt
            postinstall: |
              update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
              update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
              update-binfmts --import /usr/share/binfmts/wine
              update-binfmts --enable
              update-binfmts --display
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: ""
            config-opts: "--with-gui=qt5 --disable-tests"
            goal: install

          # ============================================================
          # Intel macOS
          #
          # PRIMARY SDK:
          #   Dogecoin Core's existing MacOSX10.11.sdk.tar.gz
          #
          # FALLBACK SDK:
          #   Phracker MacOSX10.11.sdk.tar.xz
          #
          # The original SDK remains the first choice.
          # ============================================================
          - name: x86_64-macos
            host: x86_64-apple-darwin11
            container: ubuntu:20.04
            packages: cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools libtinfo5 xorriso
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: ""
            config-opts: "--with-gui=qt5 --disable-tests"
            goal: deploy

            sdk: 10.11
            sdk-url: "https://depends.dogecoincore.org"
            sdk-filename: "MacOSX10.11.sdk.tar.gz"
            sdk-shasum: "bec9d089ebf2e2dd59b1a811a38ec78ebd5da18cbbcd6ab39d1e59f64ac5033f"

            sdk-fallback-url: "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3"
            sdk-fallback-filename: "MacOSX10.11.sdk.tar.xz"
            sdk-fallback-shasum: "d080fc672d94f95eb54651c37ede80f61761ce4c91f87061e11a20222c8d00c8"

          # ============================================================
          # Apple Silicon macOS
          #
          # IMPORTANT:
          # This is a native ARM64 macOS build.
          #
          # Do NOT use the Intel/cross-compile SDK machinery here.
          # GitHub's macos-14 runner already provides the correct native
          # Apple Silicon SDK and compiler.
          #
          # The host triplet is detected dynamically from config.guess
          # during the build instead of forcing an old darwin21 target.
          # ============================================================
          - name: aarch64-macos
            runs-on: macos-14
            container: ""
            packages: ""
            run-bench: false
            check-security: true
            check-symbols: false
            dep-opts: "WITH_OPENSSL=1"
            config-opts: "--with-gui=qt5 --disable-tests"
            goal: deploy
            native-macos: true

    runs-on: ${{ matrix.runs-on || 'ubuntu-22.04' }}

    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container-options == '' && '-e 1MWC=1MWC' || matrix.container-options }}

    steps:

      # ================================================================
      # Linux container setup
      # ================================================================
      - name: Configure container (Linux only)
        if: ${{ matrix.container && matrix.name != 'aarch64-macos' }}
        run: |
          ln -snf /usr/share/zoneinfo/Etc/UTC /etc/localtime || true
          echo Etc/UTC > /etc/timezone || true
          mkdir -p $WINEPREFIX || true
          uname -a

      # ================================================================
      # Native macOS setup
      # ================================================================
      - name: Configure macOS runner
        if: ${{ matrix.native-macos }}
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Native Apple Silicon macOS build"
          echo "============================================================"

          uname -a
          uname -m

          echo ""
          echo "Xcode:"
          xcode-select -p
          xcodebuild -version

          echo ""
          echo "Clang:"
          clang --version
          clang++ --version

          echo ""
          echo "Native SDK:"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"

          xcrun --sdk macosx --show-sdk-version

          echo ""
          echo "Architecture:"
          arch

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "ERROR: aarch64-macos is not running on an ARM64 runner."
            exit 1
          fi

          echo ""
          echo "Native ARM64 macOS runner confirmed."

      # ================================================================
      # Pre install
      # ================================================================
      - name: Pre install
        if: ${{ matrix.preinstall }}
        run: ${{ matrix.preinstall }}

      # ================================================================
      # Install packages
      # ================================================================
      - name: Install packages
        shell: bash
        run: |
          set -e

          if [[ "${{ matrix.native-macos }}" == "true" ]]; then

            echo "============================================================"
            echo "Installing native macOS build dependencies"
            echo "============================================================"

            brew update || true

            brew install \
              cmake \
              imagemagick \
              libtiff \
              xorriso \
              autoconf \
              automake \
              libtool \
              pkg-config \
              ccache \
              librsvg \
              python

            echo "$(brew --prefix python)/bin" >> "$GITHUB_PATH"

            export PATH="$(brew --prefix python)/bin:$PATH"
            export PIP_BREAK_SYSTEM_PACKAGES=1

            python3 -m pip install \
              --user \
              --upgrade \
              pip \
              setuptools \
              wheel \
              virtualenv \
              --break-system-packages

            python3 -m pip install \
              --user \
              lief \
              --break-system-packages || true

            echo ""
            echo "Python:"
            which python3
            python3 --version

            echo ""
            echo "setuptools:"
            python3 -c "import setuptools; print(setuptools.__version__)"

            echo ""
            echo "Homebrew:"
            brew --prefix

          elif command -v apt-get >/dev/null; then

            apt-get update

            apt-get install -y \
              build-essential \
              libtool \
              autotools-dev \
              automake \
              pkg-config \
              bsdmainutils \
              curl \
              ca-certificates \
              ccache \
              rsync \
              git \
              procps \
              bison \
              python3 \
              python3-pip \
              python3-setuptools \
              python3-wheel \
              autoconf-archive

            ln -sf /usr/bin/python3 /usr/bin/python

            apt-get install -y ${{ matrix.packages }}

          else

            apk add --no-cache \
              build-base \
              linux-headers \
              cmake \
              python3 \
              bash \
              git \
              curl \
              perl \
              automake \
              autoconf \
              libtool \
              pkgconfig

          fi

          python3 -m ensurepip --upgrade || true
          python3 -m pip install --upgrade pip setuptools wheel || true
          python3 -m pip install lief || true

      # ================================================================
      # Post install
      # ================================================================
      - name: Post install
        if: ${{ matrix.postinstall }}
        run: ${{ matrix.postinstall }}

      # ================================================================
      # Checkout
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================================================
      # Submodules
      # ================================================================
      - name: Fix permissions and init submodules
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
          chmod +x depends/config.guess depends/config.sub || true

      # ================================================================
      # SDK cache
      #
      # Only Intel macOS uses the downloaded legacy SDK.
      # Native Apple Silicon uses the runner SDK directly.
      # ================================================================
      - name: SDK cache
        if: ${{ matrix.sdk }}
        uses: actions/cache@v4
        env:
          CACHE_NAME: sdk
        with:
          path: ./depends/sdk-sources
          key: ${{ matrix.name }}-${{ env.CACHE_NAME }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # ================================================================
      # Install legacy Intel macOS SDK
      # ================================================================
      - name: Install SDK
        if: ${{ matrix.sdk }}
        shell: bash
        run: |
          set -e

          mkdir -p depends/sdk-sources
          mkdir -p depends/SDKs

          cd depends/sdk-sources

          PRIMARY_FILE="${{ matrix.sdk-filename }}"
          PRIMARY_URL="${{ matrix.sdk-url }}/${{ matrix.sdk-filename }}"
          PRIMARY_SHA="${{ matrix.sdk-shasum }}"

          FALLBACK_FILE="${{ matrix.sdk-fallback-filename }}"
          FALLBACK_URL="${{ matrix.sdk-fallback-url }}/${{ matrix.sdk-fallback-filename }}"
          FALLBACK_SHA="${{ matrix.sdk-fallback-shasum }}"

          echo "============================================================"
          echo "Installing legacy SDK for ${{ matrix.name }}"
          echo "============================================================"

          verify_sha256() {
            local file="$1"
            local expected="$2"

            if [[ ! -f "$file" ]]; then
              return 1
            fi

            if command -v sha256sum >/dev/null 2>&1; then
              echo "$expected  $file" | sha256sum -c >/dev/null 2>&1
            else
              echo "$expected  $file" | shasum -a 256 -c >/dev/null 2>&1
            fi
          }

          download_file() {
            local url="$1"
            local file="$2"

            echo "Downloading:"
            echo "  $url"
            echo "  -> $file"

            curl \
              --location \
              --fail \
              --show-error \
              --silent \
              --retry 3 \
              --retry-delay 2 \
              "$url" \
              -o "$file"
          }

          echo ""
          echo "------------------------------------------------------------"
          echo "Attempting PRIMARY SDK"
          echo "------------------------------------------------------------"

          echo "URL: $PRIMARY_URL"
          echo "SHA256: $PRIMARY_SHA"

          PRIMARY_OK=false

          if verify_sha256 "$PRIMARY_FILE" "$PRIMARY_SHA"; then
            echo "Primary SDK already exists and checksum is valid."
            PRIMARY_OK=true
          else
            echo "Primary SDK is missing or checksum is invalid."

            rm -f "$PRIMARY_FILE"

            if download_file "$PRIMARY_URL" "$PRIMARY_FILE"; then
              if verify_sha256 "$PRIMARY_FILE" "$PRIMARY_SHA"; then
                echo "Primary SDK downloaded and checksum verified."
                PRIMARY_OK=true
              else
                echo "Primary SDK downloaded but checksum verification FAILED."
                rm -f "$PRIMARY_FILE"
              fi
            else
              echo "Primary SDK download FAILED."
            fi
          fi

          if [[ "$PRIMARY_OK" != "true" ]]; then

            echo ""
            echo "============================================================"
            echo "PRIMARY SDK UNAVAILABLE"
            echo "Switching to FALLBACK SDK"
            echo "============================================================"

            echo "URL: $FALLBACK_URL"
            echo "SHA256: $FALLBACK_SHA"

            if [[ -z "$FALLBACK_FILE" || -z "$FALLBACK_URL" || -z "$FALLBACK_SHA" ]]; then
              echo "ERROR: No fallback SDK is configured for this build."
              exit 1
            fi

            if verify_sha256 "$FALLBACK_FILE" "$FALLBACK_SHA"; then
              echo "Fallback SDK already exists and checksum is valid."
            else
              echo "Fallback SDK is missing or checksum is invalid."

              rm -f "$FALLBACK_FILE"

              if ! download_file "$FALLBACK_URL" "$FALLBACK_FILE"; then
                echo "ERROR: Fallback SDK download FAILED."
                exit 1
              fi

              if ! verify_sha256 "$FALLBACK_FILE" "$FALLBACK_SHA"; then
                echo "ERROR: Fallback SDK checksum verification FAILED."
                exit 1
              fi

              echo "Fallback SDK downloaded and checksum verified."
            fi

            SDK_FILE="$FALLBACK_FILE"

          else

            SDK_FILE="$PRIMARY_FILE"

          fi

          echo ""
          echo "============================================================"
          echo "SDK selected:"
          echo "$SDK_FILE"
          echo "============================================================"

          cd ../..

          rm -rf depends/SDKs/*

          tar -C depends/SDKs -xf "depends/sdk-sources/$SDK_FILE"

          echo ""
          echo "SDK extraction complete."

      # ================================================================
      # Build depends
      # ================================================================
      - name: Build depends
        shell: bash
        run: |
          set -e

          export CONFIG_SHELL=/bin/bash
          export SHELL=/bin/bash

          if [[ "${{ matrix.native-macos }}" == "true" ]]; then

            echo "============================================================"
            echo "Configuring native Apple Silicon depends"
            echo "============================================================"

            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            export MACOSX_DEPLOYMENT_TARGET="11.0"

            export CC="$(xcrun --find clang)"
            export CXX="$(xcrun --find clang++)"

            export HOMEBREW_PREFIX="$(brew --prefix)"
            export PATH="$HOMEBREW_PREFIX/bin:$PATH"

            export PYTHON="$HOMEBREW_PREFIX/bin/python3"
            export PYTHON3="$HOMEBREW_PREFIX/bin/python3"

            export PIP_BREAK_SYSTEM_PACKAGES=1

            echo ""
            echo "Native macOS configuration:"
            echo "  Architecture: $(uname -m)"
            echo "  SDKROOT: $SDKROOT"
            echo "  SDK version: $(xcrun --sdk macosx --show-sdk-version)"
            echo "  CC: $CC"
            echo "  CXX: $CXX"
            echo "  Python: $PYTHON"
            echo "  Deployment target: $MACOSX_DEPLOYMENT_TARGET"

            if [[ "$(uname -m)" != "arm64" ]]; then
              echo "ERROR: Expected arm64 runner."
              exit 1
            fi

            echo ""
            echo "Using native ARM64 compiler:"
            "$CC" --version

            echo ""
            echo "Installing Python compatibility helpers..."

            "$PYTHON" -m pip install \
              --user \
              --upgrade \
              ez_setup \
              --break-system-packages || true

            "$PYTHON" -c "import setuptools; print('setuptools OK')"

            echo ""
            echo "Writing macOS environment to GITHUB_ENV..."

            echo "MACOS_SDK_PATH=$SDKROOT" >> "$GITHUB_ENV"
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"

            echo ""
            echo "Running native ARM64 depends build..."

            make $MAKEJOBS -C depends \
              HOST="$(./depends/config.guess)" \
              OPENSSL_TARGET="$OPENSSL_TARGET" \
              ${{ matrix.dep-opts }}

          else

            make $MAKEJOBS -C depends \
              HOST=${{ matrix.host }} \
              OPENSSL_TARGET=$OPENSSL_TARGET \
              ${{ matrix.dep-opts }}

          fi

      # ================================================================
      # CCache
      # ================================================================
      - name: CCache
        uses: actions/cache@v4
        env:
          CACHE_NAME: ccache
        with:
          path: ~/.ccache
          key: ${{ matrix.name }}-${{ env.CACHE_NAME }}-${{ hashFiles('**/configure.ac', '.github/workflows/ci.yml') }}

      # ================================================================
      # Build MinersWorldCoin
      # ================================================================
      - name: Build MinersWorldCoin
        env:
          GIT_COMMIT_ID: ${{ github.sha }}
        shell: bash
        run: |
          set -e

          chmod +x autogen.sh
          chmod -R +x depends || true
          chmod +x share/genbuild.sh

          SHORT_COMMIT=$(echo "$GIT_COMMIT_ID" | cut -c1-7)

          # ------------------------------------------------------------
          # Determine ccache location.
          # ------------------------------------------------------------
          if [[ "${{ matrix.native-macos }}" == "true" ]]; then
            export PATH="$(brew --prefix ccache)/bin:$PATH"

            if command -v ccache >/dev/null 2>&1; then
              ccache --max-size="$CCACHE_SIZE"
            fi
          else
            depends/${{ matrix.host }}/native/bin/ccache --max-size=$CCACHE_SIZE
          fi

          ./autogen.sh
          chmod +x configure || true

          SDKFLAGS=""
          EXTRA_LDFLAGS=""

          if [[ "${{ matrix.native-macos }}" == "true" ]]; then

            export SDKROOT="${MACOS_SDK_PATH:-$(xcrun --sdk macosx --show-sdk-path)}"
            export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET:-11.0}"

            SDKFLAGS="-isysroot ${SDKROOT}"
            EXTRA_LDFLAGS="-L${SDKROOT}/usr/lib"

            export CC="$(xcrun --find clang)"
            export CXX="$(xcrun --find clang++)"

            echo "============================================================"
            echo "Native ARM64 configure environment"
            echo "============================================================"

            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "SDKROOT=$SDKROOT"
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"

            echo ""
            echo "Compiler target:"
            "$CC" -dumpmachine || true

            echo ""
            echo "Compiler architecture:"
            "$CC" -arch arm64 -E -x c /dev/null -o /dev/null

            CONFIG_HOST="$(./depends/config.guess)"

            echo ""
            echo "Detected native host:"
            echo "$CONFIG_HOST"

            ./configure \
              --prefix="$(pwd)/depends/${CONFIG_HOST}" \
              ${{ matrix.config-opts }} \
              --enable-reduce-exports \
              --host="$CONFIG_HOST" \
              CFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -pipe -O2 -DGIT_COMMIT_ID=\"$SHORT_COMMIT\"" \
              CXXFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -std=c++17 -pipe -O2 -DGIT_COMMIT_ID=\"$SHORT_COMMIT\"" \
              LDFLAGS="$SDKFLAGS $EXTRA_LDFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
              || (
                cat config.log
                false
              )

            make $MAKEJOBS ${{ matrix.goal }} \
              CFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
              CXXFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -std=c++17" \
              || (
                echo "Build failure. Verbose build follows."

                make ${{ matrix.goal }} \
                  CFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
                  CXXFLAGS="$SDKFLAGS -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -std=c++17" \
                  V=1

                false
              )

          else

            ./configure \
              --prefix="$(pwd)/depends/${{ matrix.host }}" \
              ${{ matrix.config-opts }} \
              --enable-reduce-exports \
              CFLAGS="$SDKFLAGS -pipe -O2 -DGIT_COMMIT_ID=\"$SHORT_COMMIT\"" \
              CXXFLAGS="$SDKFLAGS -std=c++17 -pipe -O2 -DGIT_COMMIT_ID=\"$SHORT_COMMIT\"" \
              LDFLAGS="$SDKFLAGS $EXTRA_LDFLAGS" \
              || (
                cat config.log
                false
              )

            make $MAKEJOBS ${{ matrix.goal }} \
              CXXFLAGS="-std=c++17 $SDKFLAGS" \
              || (
                echo "Build failure. Verbose build follows."

                make ${{ matrix.goal }} \
                  CXXFLAGS="-std=c++17 $SDKFLAGS" \
                  V=1

                false
              )

          fi

      # ================================================================
      # Run benchmark
      # ================================================================
      - name: Run benchmark
        if: ${{ matrix.run-bench }}
        run: |
          src/bench/bench_minersworldcoin > ${{ matrix.name }}-bench.csv
          cat ${{ matrix.name }}-bench.csv

      # ================================================================
      # Security checks
      # ================================================================
      - name: Fix permissions for security-check.py
        run: chmod +x contrib/devtools/security-check.py

      - name: Check security
        if: ${{ matrix.check-security }}
        run: make -C src check-security

      - name: Check symbols
        if: ${{ matrix.check-symbols }}
        run: make -C src check-symbols

      # ================================================================
      # Cleanup
      # ================================================================
      - name: Cleanup qa artifacts
        run: rm -rf qa/cache || true

      # ================================================================
      # Upload artifacts
      # ================================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minersworldcoin-${{ github.sha }}-${{ matrix.name }}
          path: |
            depends/${{ matrix.host }}/bin/minersworldcoin*
            depends/${{ matrix.host }}/lib/libbitcoinconsensus*
            depends/${{ matrix.host }}/include/bitcoinconsensus.h
            depends/${{ matrix.host }}/share/man/man1/minersworldcoin*
            dist/MinersWorldCoin-Qt.app
            MinersWorldCoin-Core.dmg
            dist/*.dmg
            dist/*.app
            ${{ matrix.name }}-bench.csv
